name: DraBornPark v1.0.22 Web Version Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/DRABORNPARK_V122_WEB_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-v122:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh all visible DraBornPark versions and cache keys
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='DraBornPark';
          const allowed=new Set(['.html','.js','.css','.json','.md']);
          let changed=0;
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const file=path.join(dir,name);const st=fs.statSync(file);
              if(st.isDirectory()){walk(file);continue;}
              if(!allowed.has(path.extname(file)))continue;
              let s=fs.readFileSync(file,'utf8');const before=s;
              s=s.replace(/v1\.0\.(?:[0-9]|1[0-9]|2[01])(?!\d)/g,'v1.0.22');
              s=s.replace(/(?<![\d.])1\.0\.(?:[0-9]|1[0-9]|2[01])(?!\d)/g,'1.0.22');
              s=s.replace(/\?v=1210\b/g,'?v=1220');
              s=s.replace(/BUILD='1210'/g,"BUILD='1220'");
              s=s.replace(/dataset\.dkdVersion='121'/g,"dataset.dkdVersion='122'");
              s=s.replace(/\.dataset\.dkdVersion='121'/g,".dataset.dkdVersion='122'");
              if(s!==before){fs.writeFileSync(file,s);changed++;console.log('updated',file);}
            }
          }
          walk(root);
          console.log('DraBornPark v1.0.22 files changed:',changed);
          NODE
          grep -F 'v1.0.22' DraBornPark/tag/index.html >/dev/null
          grep -F 'BUILD='"'"'1220'"'"'' DraBornPark/tag/index.html >/dev/null
          grep -F 'v1.0.22' DraBornPark/privacy/index.html >/dev/null
          if grep -R -nE 'v1\.0\.(14|15|16|17|18|19|20|21)([^0-9]|$)' DraBornPark --include='*.html' --include='*.js'; then
            echo 'Old visible DraBornPark version remains.'
            exit 1
          fi
      - name: Commit synchronized web version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DraBornPark
          if git diff --cached --quiet; then
            echo 'DraBornPark web already at v1.0.22.'
          else
            git commit -m 'release: sync DraBornPark web to v1.0.22'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
