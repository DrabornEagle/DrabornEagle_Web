name: DraBornNews feed

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkd-drabornnews-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DraBornNews
          persist-credentials: true
      - name: Read publisher feeds and prepare short summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DKD_NEWS_MODEL: gpt-4.1-mini
        run: python3 DraBornNews/scripts/dkd_collect.py
      - name: Publish changed feed
        run: |
          if git diff --quiet -- DraBornNews/data/news.json; then
            echo 'News feed is unchanged.'
            exit 0
          fi
          git config user.name 'DraBornNews Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DraBornNews/data/news.json
          git commit -m 'data(DraBornNews): refresh sourced news digest'
          git push
