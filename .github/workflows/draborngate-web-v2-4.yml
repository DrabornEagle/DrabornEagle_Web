name: DraBornGate Web v2.9.1 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v2-9-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerçek yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: Kararlı Sade Tema çekirdeğini doğrula
        run: node --check DraBornGate/assets/v2.8.js
      - name: Uygulama motosiklet düzeltmesini doğrula
        run: node --check DraBornGate/assets/v2.8.1.js
      - name: Ayrıntılı canlı kuyruk sözdizimini doğrula
        run: node --check DraBornGate/assets/v2.9.js
      - name: Açılış kurtarma sözdizimini doğrula
        run: node --check DraBornGate/assets/v2.9.1-boot-recovery.js
      - name: Service Worker sözdizimini doğrula
        run: node --check DraBornGate/sw.js
      - name: Web v2.9 kapsamını doğrula
        run: node DraBornGate/tests/dkd_verify_web_v290.mjs
      - name: Web v2.9.1 açılış kurtarmayı doğrula
        run: node DraBornGate/tests/dkd_verify_boot_recovery_v291.mjs
