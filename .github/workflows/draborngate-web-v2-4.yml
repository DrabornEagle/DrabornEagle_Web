name: DraBornGate Web v2.9.3 Emergency Stable Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v2-9-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kararlı yükleyiciyi doğrula
        run: node --check DraBornGate/assets/app-v2.9.3-stable.js
      - name: Service Worker kaldırma sözdizimini doğrula
        run: node --check DraBornGate/sw.js
      - name: Tıklanabilir acil panel kapsamını doğrula
        run: node DraBornGate/tests/dkd_verify_emergency_stable_v293.mjs
