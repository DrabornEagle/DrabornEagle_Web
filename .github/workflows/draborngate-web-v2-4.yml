name: DraBornGate Web v3.0.0 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-0-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.0 yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: v2.8 güvenli eşleştirme köprüsünü doğrula
        run: node --check DraBornGate/assets/v2.8.js
      - name: Uygulama motosiklet ikonunu doğrula
        run: node --check DraBornGate/assets/v2.8.1.js
      - name: v3.0 ayrıntılı kurye verilerini doğrula
        run: node --check DraBornGate/assets/v3.0.data.js
      - name: v3.0 ayrıntılı kurye arayüzünü doğrula
        run: node --check DraBornGate/assets/v3.0.js
      - name: v3.0 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v3.mjs
