name: DraBornGate Web v3.1.2 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-1-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.1.2 yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: v3.1.2 sürüm ve oturum korumasını doğrula
        run: node --check DraBornGate/assets/v3.1.2.guard.js
      - name: v3.1.2 RPC veri katmanını doğrula
        run: node --check DraBornGate/assets/v3.1.2.data.js
      - name: Tek DraBornGate motosiklet ikonunu doğrula
        run: node --check DraBornGate/assets/v3.1.2.moto.js
      - name: v3.1.2 arayüz yükleyicisini doğrula
        run: node --check DraBornGate/assets/v3.1.2.js
      - name: v3.1.2 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v312.mjs
