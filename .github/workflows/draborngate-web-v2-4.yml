name: DraBornGate Web v3.2.4 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-2-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.2.4 yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: v3.2.4 sürüm korumasını doğrula
        run: node --check DraBornGate/assets/v3.2.4.guard.js
      - name: v3.2.4 public RPC ve Admin veri katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.4.data.js
      - name: v3.2.4 arayüz yükleyicisini doğrula
        run: node --check DraBornGate/assets/v3.2.4.js
      - name: v3.2.4 arayüz düzeltmelerini doğrula
        run: node --check DraBornGate/assets/v3.2.4.patch.js
      - name: Service worker sözdizimini doğrula
        run: node --check DraBornGate/sw.js
      - name: v3.2.4 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v324.mjs
