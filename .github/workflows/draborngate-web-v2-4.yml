name: DraBornGate Web v3.2.3 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-2-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.2.3 ana yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: v3.2.3 sürüm korumasını doğrula
        run: node --check DraBornGate/assets/v3.2.3.guard.js
      - name: v3.2.3 güvenli veri katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.3.data.js
      - name: v3.2.3 arayüz katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.3.ui.js
      - name: Service worker sözdizimini doğrula
        run: node --check DraBornGate/sw.js
      - name: v3.2.3 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v323.mjs
