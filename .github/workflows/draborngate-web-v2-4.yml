name: DraBornGate Web v2.8.1 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v2-8-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerçek yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: Kararlı Sade Tema sözdizimini doğrula
        run: node --check DraBornGate/assets/v2.8.js
      - name: Uygulama motosiklet ikonunu doğrula
        run: node --check DraBornGate/assets/v2.8.1.js
      - name: Yükleme, geçiş ve canlı talep kapsamını doğrula
        run: node DraBornGate/tests/dkd_verify_security_simple_theme.mjs
      - name: Motosiklet ve metin düzeltmesini doğrula
        run: node DraBornGate/tests/dkd_verify_racing_motorcycle_patch.mjs
