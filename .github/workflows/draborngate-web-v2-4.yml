name: DraBornGate Web v3.2.9 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
      - 'codex/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-2-9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.2.9 yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: v3.2.9 sürüm korumasını doğrula
        run: node --check DraBornGate/assets/v3.2.9.guard.js
      - name: v3.2.9 bağımsız Sade Tema katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.9.simple.js
      - name: v3.2.9 Kurye paneli katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.9.js
      - name: Veri ve oturum yükleyicilerini doğrula
        run: |
          node --check DraBornGate/assets/v3.1.1.data.js
          node --check DraBornGate/assets/v3.2.1.data.js
          node --check DraBornGate/assets/v3.2.4.data.js
          node --check DraBornGate/assets/v3.2.4.auth.js
          node --check DraBornGate/assets/v3.2.4.session.js
      - name: Premium arayüz yükleyicisini doğrula
        run: node --check DraBornGate/assets/v3.2.1.js
      - name: Service worker sözdizimini doğrula
        run: node --check DraBornGate/sw.js
      - name: v3.2.9 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v329.mjs
