name: DraBornGate Web v3.2.9 Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
      - 'codex/**'
      - 'release/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/draborngate-web-v2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-2-9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.2.9 yükleme yöneticisini doğrula
        run: node --check DraBornGate/assets/app.js
      - name: v3.2.9 sürüm korumasını doğrula
        run: node --check DraBornGate/assets/v3.2.9.guard.js
      - name: v3.2.9 modern düzeltme katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.9.js
      - name: v3.2.9 bağımsız Sade Temayı doğrula
        run: node --check DraBornGate/assets/v3.2.9.simple.js
      - name: v3.2.8 uyumluluk katmanını doğrula
        run: node --check DraBornGate/assets/v3.2.8.js
      - name: v3.2.5 uyumluluk katmanlarını doğrula
        run: |
          node --check DraBornGate/assets/v3.2.5.guard.js
          node --check DraBornGate/assets/v3.2.5.stability.js
          node --check DraBornGate/assets/v3.2.5.js
      - name: v3.2.5 sıkıştırılmış modüllerini doğrula
        shell: bash
        run: |
          base64 -d DraBornGate/assets/v3.2.5.session.js.payload.txt | gzip -dc > /tmp/dkd-v325-session.js
          base64 -d DraBornGate/assets/v3.2.5.features.js.payload.txt | gzip -dc > /tmp/dkd-v325-features.js
          node --check /tmp/dkd-v325-session.js
          node --check /tmp/dkd-v325-features.js
      - name: Veri başlangıcını doğrula
        run: node --check DraBornGate/assets/v3.2.1.data.js
      - name: Service worker sözdizimini doğrula
        run: node --check DraBornGate/sw.js
      - name: v3.2.9 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v329.mjs
