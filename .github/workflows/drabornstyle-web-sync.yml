name: DraBornStyle web sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/drabornstyle-web-sync.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: drabornstyle-web-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the shared source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/DrabornEagle/DraBornStyle.git "$RUNNER_TEMP/style-source"
          STYLE_SOURCE_SHA=$(git -C "$RUNNER_TEMP/style-source" rev-parse HEAD)
          STYLE_CURRENT_SHA=$(node -e 'try{console.log(require("./DraBornStyle/DBSTYLE-SOURCE.json").commit)}catch{console.log("missing")}')
          echo "sha=$STYLE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$STYLE_SOURCE_SHA" != "$STYLE_CURRENT_SHA" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Validate and export DraBornStyle
        if: steps.source.outputs.changed == 'true'
        env:
          STYLE_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/style-source"
          npm ci
          npm run typecheck
          npm test
          EXPO_OFFLINE=1 npx expo install --check
          npm run build:web
          test -s dist/index.html
          test -s dist/DBSTYLE-SOURCE.json
      - name: Update only the DraBornStyle folder
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -p DraBornStyle
          rsync -a --delete "$RUNNER_TEMP/style-source/dist/" DraBornStyle/
          mkdir -p DraBornStyle/source
          git -C "$RUNNER_TEMP/style-source" archive HEAD | tar -x -C DraBornStyle/source
          cp "$RUNNER_TEMP/style-source/README.md" DraBornStyle/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A DraBornStyle
          if ! git diff --cached --quiet; then
            git commit -m 'build(DraBornStyle): sync validated web from shared source'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
