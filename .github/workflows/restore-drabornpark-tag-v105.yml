name: Restore DraBornPark v1.0.5 Tag Design

on:
  push:
    branches: [main]
    paths:
      - 'DraBornPark/RESTORE_TAG_V105_TRIGGER'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore premium protected vehicle page
        run: node DraBornPark/restore-tag-design-v105.mjs
      - name: Validate path tag integration
        run: |
          grep -q 'DKDBP_PATH_TAG' DraBornPark/contact-v051.js
          grep -q 'DKDBP_PATH_TAG' DraBornPark/web-v055.js
          grep -q '<base href="/DraBornPark/">' DraBornPark/tag/index.html
          grep -q 'card-min-v055.js' DraBornPark/tag/index.html
          grep -q 'GÜVENLİ ARAÇ İLETİŞİMİ' DraBornPark/contact-v051.js
      - name: Commit restored design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DraBornPark/tag/index.html DraBornPark/contact-v051.js DraBornPark/web-v055.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(DraBornPark): restore premium Güvenli Araç İletişimi tag page'
            git push origin HEAD:main
          fi
