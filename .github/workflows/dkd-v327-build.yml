name: DraBornGate v3.2.7 Release Build

on:
  push:
    branches:
      - dkd-v327-release
    paths:
      - '.github/workflows/dkd-v327-build.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v3.2.7
        run: node DraBornGate/scripts/dkd_build_v327.mjs
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check DraBornGate/assets/app.js
          node --check DraBornGate/assets/v3.2.7.guard.js
          node --check DraBornGate/assets/v3.2.7.js
          node --check DraBornGate/assets/v3.2.7.features.js
          node --check DraBornGate/assets/v3.2.1.data.js
          node --check DraBornGate/sw.js
      - name: Run v3.2.7 tests
        run: node DraBornGate/tests/dkd_verify_web_v327.mjs
      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DraBornGate/assets/app.js DraBornGate/assets/v3.2.1.data.js DraBornGate/index.html DraBornGate/Guvenlik-Sade-Tema/index.html DraBornGate/manifest.webmanifest DraBornGate/sw.js .github/workflows/draborngate-web-v2-4.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: build DraBornGate Web v3.2.7 [skip ci]"
          git push
