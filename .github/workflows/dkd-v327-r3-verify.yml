name: DraBornGate Web v3.2.7-r3 Boot Verify

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/dkd-v327-r3-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DraBornGate/**'
      - '.github/workflows/dkd-v327-r3-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-web-v3-2-7-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: r3 açılış yükleyicisini doğrula
        run: node --check DraBornGate/assets/app.v3.2.7-r3.js
      - name: r3 açılış regresyon testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_boot_r3.mjs
      - name: Mevcut v3.2.7 kapsam testlerini çalıştır
        run: node DraBornGate/tests/dkd_verify_web_v327.mjs
