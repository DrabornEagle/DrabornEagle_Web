name: DKD Last Mile v0.7.5 web and APK sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-lastmile-web-sync.yml'
      - 'scripts/dkd-sync-lastmile-release.mjs'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dkd-lastmile-web-sync
  cancel-in-progress: false

jobs:
  dkd-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: DrabornEagle/DraBornGames
          ref: main
          path: dkd-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dkd-source/LastMile/package-lock.json
      - name: Check shared v0.7.5 source revision
        id: dkd-revision
        run: |
          dkd_sha="$(git -C dkd-source rev-parse HEAD)"
          echo "DKD_SOURCE_COMMIT=$dkd_sha" >> "$GITHUB_ENV"
          dkd_previous="$(node -e "try{console.log(require('./DraBornGames/LastMile/version.json').dkd_sourceCommit)}catch{}")"
          if [[ "$dkd_sha" != "$dkd_previous" || ! -s DraBornGames/LastMile/index.html ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build Android-shared v0.7.5 web game
        if: steps.dkd-revision.outputs.changed == 'true'
        working-directory: dkd-source/LastMile
        env:
          DKD_WEB_OUTPUT: ${{ github.workspace }}/DraBornGames/LastMile
          DKD_SOURCE_COMMIT: ${{ env.DKD_SOURCE_COMMIT }}
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
          npm test
          npm run typecheck
      - name: DKD Ensure Last Mile SEO metadata
        if: steps.dkd-revision.outputs.changed == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'DraBornGames/LastMile/index.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.trim()) throw new Error('LastMile index.html is empty after web build.');
          const markerStart = '<!-- DKD LASTMILE SEO START -->';
          const markerEnd = '<!-- DKD LASTMILE SEO END -->';
          html = html.replace(new RegExp(markerStart + '[\\s\\S]*?' + markerEnd, 'g'), '');
          const seo = `
          ${markerStart}
          <meta name="description" content="Last Mile, DraBornGames tarafından geliştirilen kurye ve teslimat kariyer simülasyonudur. Tarayıcı sürümünü keşfet ve oyuna başla.">
          <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
          <link rel="canonical" href="https://www.draborneagle.com/DraBornGames/LastMile/">
          <meta property="og:locale" content="tr_TR">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="DraBornEagle">
          <meta property="og:title" content="Last Mile | DraBornGames Kurye Simülasyonu">
          <meta property="og:description" content="Last Mile, DraBornGames tarafından geliştirilen kurye ve teslimat kariyer simülasyonudur.">
          <meta property="og:url" content="https://www.draborneagle.com/DraBornGames/LastMile/">
          <meta property="og:image" content="https://www.draborneagle.com/DraBornGames/assets/dkd-last-mile.webp">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Last Mile | DraBornGames Kurye Simülasyonu">
          <meta name="twitter:description" content="DraBornGames Last Mile kurye ve teslimat kariyer simülasyonunu tarayıcıda keşfet.">
          <meta name="twitter:image" content="https://www.draborneagle.com/DraBornGames/assets/dkd-last-mile.webp">
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Last Mile","url":"https://www.draborneagle.com/DraBornGames/LastMile/","publisher":{"@type":"Organization","name":"DraBornEagle"},"inLanguage":"tr-TR"}</script>
          ${markerEnd}
          `;
          html = html.replace(/<title[^>]*>[\s\S]*?<\/title>/i, '<title>Last Mile | DraBornGames Kurye Simülasyonu</title>');
          if (!/<title/i.test(html)) html = html.replace(/<head[^>]*>/i, m => m + '\n<title>Last Mile | DraBornGames Kurye Simülasyonu</title>');
          html = html.replace(/<\/head>/i, seo + '\n</head>');
          fs.writeFileSync(file, html);
          NODE

      - name: Point DraBornGames platform to LastMile web build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dkd_file = Path('DraBornGames/index.html')
          dkd_text = dkd_file.read_text()
          dkd_text = dkd_text.replace('./Last-Mile/', './LastMile/')
          dkd_text = dkd_text.replace('LAST MILE APK İNDİR', 'APK İNDİR')
          dkd_file.write_text(dkd_text)
          PY
      - name: Sync verified signed APK and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dkd-sync-lastmile-release.mjs
      - name: Commit synchronized game APK and platform
        id: dkd-publish
        run: |
          git config user.name 'DKD Games Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DraBornGames/LastMile DraBornGames/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(lastmile): sync v0.7.5 web/APK source ${DKD_SOURCE_COMMIT:0:12}"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Pages
        if: steps.dkd-publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dkd_company_pages.yml --repo "$GITHUB_REPOSITORY" --ref main
