# DraBornOdds APK/web immediate sync trigger. v0.7.3 deployment checkpoint.
name: DraBornOdds synchronized web
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-drabornodds-web-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: dkd-drabornodds-web-sync
  cancel-in-progress: true
jobs:
  dkd-sync-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout canonical Android/Web source
        run: git clone --depth 50 https://github.com/DrabornEagle/DraBornOdds.git "$RUNNER_TEMP/DraBornOdds-source"
      - name: Install and verify canonical source
        working-directory: ${{ runner.temp }}/DraBornOdds-source
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx expo install --check
      - name: Export the same Expo app for web
        working-directory: ${{ runner.temp }}/DraBornOdds-source
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/DraBornOdds-dist"
      - name: Replace DraBornOdds website from canonical export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf DraBornOdds
          mkdir -p DraBornOdds
          cp -a "$RUNNER_TEMP/DraBornOdds-dist/." DraBornOdds/
          cp -a "$RUNNER_TEMP/DraBornOdds-source/web-legal/." DraBornOdds/
          sed -i 's#href="../../"#href="../"#g' DraBornOdds/privacy/index.html DraBornOdds/terms/index.html DraBornOdds/data-safety/index.html DraBornOdds/support/index.html
          git -C "$RUNNER_TEMP/DraBornOdds-source" rev-parse HEAD > DraBornOdds/dkd-source-commit.txt
      - name: Download and verify matching signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          dkd_source_repo="$RUNNER_TEMP/DraBornOdds-source"
          dkd_version="$(node -p "require('$dkd_source_repo/app.json').expo.version")"
          dkd_code="$(node -p "require('$dkd_source_repo/app.json').expo.android.versionCode")"
          dkd_tag="drabornodds-v${dkd_version}-code${dkd_code}"
          dkd_apk="DraBornOdds-v${dkd_version}-code${dkd_code}-release.apk"
          dkd_release_base="https://github.com/DrabornEagle/DraBornGo/releases/download/${dkd_tag}"
          mkdir -p DraBornOdds/App
          curl --retry 60 --retry-delay 10 --retry-all-errors -fL "$dkd_release_base/$dkd_apk" -o "DraBornOdds/App/$dkd_apk"
          for dkd_name in SHA256.txt CERTIFICATE.txt SOURCE_COMMIT.txt; do
            curl --retry 20 --retry-delay 5 --retry-all-errors -fL "$dkd_release_base/$dkd_name" -o "DraBornOdds/App/$dkd_name"
          done
          (cd DraBornOdds/App && sha256sum -c SHA256.txt)
          dkd_signed_source="$(tr -d '\r\n' < DraBornOdds/App/SOURCE_COMMIT.txt)"
          if ! git -C "$dkd_source_repo" cat-file -e "$dkd_signed_source^{commit}" 2>/dev/null; then
            git -C "$dkd_source_repo" fetch origin "$dkd_signed_source" --depth=1
          fi
          if ! git -C "$dkd_source_repo" diff --quiet "$dkd_signed_source" HEAD -- . ':(exclude).github/**'; then
            echo 'DKD ERROR: web source differs from the signed Android application source.'
            git -C "$dkd_source_repo" diff --name-only "$dkd_signed_source" HEAD -- . ':(exclude).github/**'
            exit 1
          fi
          grep -q 'Signer #1 certificate SHA-256 digest' DraBornOdds/App/CERTIFICATE.txt
          printf '%s\n' "$dkd_version" > DraBornOdds/App/VERSION.txt
          printf '%s\n' "$dkd_code" > DraBornOdds/App/VERSION_CODE.txt
          printf '%s\n' "$dkd_apk" > DraBornOdds/App/APK_NAME.txt
      - name: Create standalone APK download page
        shell: bash
        run: |
          set -euo pipefail
          dkd_version="$(cat DraBornOdds/App/VERSION.txt)"
          dkd_code="$(cat DraBornOdds/App/VERSION_CODE.txt)"
          dkd_apk="$(cat DraBornOdds/App/APK_NAME.txt)"
          dkd_sha="$(cut -d' ' -f1 DraBornOdds/App/SHA256.txt)"
          dkd_source="$(tr -d '\r\n' < DraBornOdds/App/SOURCE_COMMIT.txt)"
          cat > DraBornOdds/App/index.html <<DKD_HTML
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#080d1b">
            <meta name="color-scheme" content="dark">
            <title>DraBornOdds Android APK</title>
            <style>
              :root{--bg:#070b17;--panel:rgba(18,26,48,.78);--panel2:rgba(12,19,37,.88);--line:rgba(148,163,184,.18);--text:#f7f9ff;--muted:#aab6cd;--lime:#a8f35d;--lime2:#d9ff8e;--cyan:#55dcff;--blue:#7098ff;--violet:#b77cff;--pink:#ff6fb5;--gold:#ffd166;--shadow:0 26px 80px rgba(0,0,0,.42)}
              *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 12%,rgba(83,220,255,.12),transparent 28%),radial-gradient(circle at 86% 5%,rgba(183,124,255,.15),transparent 30%),radial-gradient(circle at 52% 85%,rgba(168,243,93,.08),transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.28;pointer-events:none;z-index:0;animation:float 11s ease-in-out infinite}.orb.one{width:240px;height:240px;background:var(--cyan);top:-90px;left:-80px}.orb.two{width:300px;height:300px;background:var(--violet);right:-150px;top:24%;animation-delay:-3s}.orb.three{width:230px;height:230px;background:var(--lime);left:22%;bottom:-140px;animation-delay:-6s}@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(18px,30px,0) scale(1.08)}}.wrap{position:relative;z-index:1;width:min(900px,100%);margin:auto;padding:34px 18px 54px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--text);font-size:clamp(25px,5vw,38px);font-weight:950;letter-spacing:-1.4px}.logo{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,var(--lime2),var(--lime));color:#07101a;box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 0 32px rgba(168,243,93,.3);animation:pulse 2.8s ease-in-out infinite}.brand b{background:linear-gradient(90deg,var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.mini-status{display:flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid rgba(168,243,93,.22);border-radius:999px;background:rgba(168,243,93,.08);color:var(--lime2);font-size:12px;font-weight:850;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime);animation:blink 1.8s ease-in-out infinite}@keyframes blink{50%{opacity:.4;transform:scale(.75)}}@keyframes pulse{50%{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 0 44px rgba(168,243,93,.42)}}
              .hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,42px);border:1px solid transparent;border-radius:32px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(130deg,rgba(168,243,93,.6),rgba(85,220,255,.35),rgba(183,124,255,.46),rgba(255,111,181,.25)) border-box;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.hero:before{content:"";position:absolute;inset:-120% -30%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.08) 49%,transparent 56%);transform:rotate(8deg);animation:sweep 7s linear infinite;pointer-events:none}@keyframes sweep{to{transform:translateX(50%) rotate(8deg)}}.eyebrow{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:850;color:#dce5f8}.chip.primary{border-color:rgba(168,243,93,.25);background:rgba(168,243,93,.1);color:var(--lime2)}h1{position:relative;margin:0;font-size:clamp(37px,8vw,66px);line-height:.98;letter-spacing:-2.6px;max-width:680px}.gradient{background:linear-gradient(90deg,var(--lime2),var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{position:relative;margin:20px 0 0;color:var(--muted);font-size:clamp(16px,3.3vw,20px);line-height:1.7;max-width:720px}.trust-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.trust{padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(6,11,24,.38)}.trust strong{display:block;font-size:14px;margin-bottom:4px}.trust span{color:var(--muted);font-size:11px}.trust i{font-style:normal;margin-right:6px}.download{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px;padding:19px 20px;border:1px solid rgba(255,255,255,.48);border-radius:22px;background:linear-gradient(105deg,var(--lime) 0%,var(--lime2) 34%,var(--cyan) 68%,var(--violet) 100%);background-size:220% 220%;color:#07101a;text-decoration:none;text-align:center;font-size:18px;font-weight:950;box-shadow:0 16px 46px rgba(168,243,93,.28),0 0 28px rgba(85,220,255,.14);overflow:hidden;transition:transform .2s ease,box-shadow .2s ease;animation:downloadGlow 3.2s ease-in-out infinite}.download:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.58) 48%,transparent 65%);transform:translateX(-130%);animation:shine 3.4s ease-in-out infinite}@keyframes shine{55%,100%{transform:translateX(135%)}}@keyframes downloadGlow{0%,100%{background-position:0% 50%;box-shadow:0 16px 46px rgba(168,243,93,.25),0 0 24px rgba(85,220,255,.12)}50%{background-position:100% 50%;box-shadow:0 20px 58px rgba(85,220,255,.32),0 0 36px rgba(183,124,255,.2)}}.download:hover{transform:translateY(-2px);box-shadow:0 20px 50px rgba(168,243,93,.3)}.download span,.download svg{position:relative;z-index:1}.subnote{position:relative;margin:11px 0 0;text-align:center;color:var(--muted);font-size:11px}.section{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.info{position:relative;padding:20px;border:1px solid var(--line);border-radius:24px;background:var(--panel2);box-shadow:0 15px 50px rgba(0,0,0,.18);overflow:hidden}.info:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-40px;top:-45px;background:var(--accent,var(--cyan));filter:blur(35px);opacity:.2}.info-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.info-title{font-weight:900;font-size:15px}.code{position:relative;z-index:1;min-height:68px;display:flex;align-items:center;word-break:break-all;background:rgba(5,10,22,.72);border:1px solid rgba(255,255,255,.055);border-radius:15px;padding:13px 14px;color:#dbe6fb;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:11px;line-height:1.5}.copy{border:0;border-radius:10px;padding:8px 10px;background:rgba(85,220,255,.1);color:var(--cyan);font:inherit;font-size:11px;font-weight:850;cursor:pointer}.copy.ok{background:rgba(168,243,93,.12);color:var(--lime)}.install{margin-top:14px;padding:22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(18,26,48,.76),rgba(12,18,35,.9))}.install h2{margin:0 0 16px;font-size:20px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{padding:14px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.55}.step b{display:grid;place-items:center;width:28px;height:28px;margin-bottom:9px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--violet));color:white;font-size:12px}.warning{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:14px 15px;border:1px solid rgba(255,209,102,.19);border-radius:17px;background:rgba(255,209,102,.055);color:#d9d0b8;font-size:12px;line-height:1.55}.footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}.footer a{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:#c8d3e7;text-decoration:none;font-size:12px;font-weight:750;transition:.2s ease}.footer a:hover{border-color:rgba(85,220,255,.34);color:var(--cyan);transform:translateY(-1px)}.copyright{text-align:center;color:#67758f;font-size:10px;margin-top:18px}
              @media(max-width:650px){.wrap{padding:24px 14px 40px}.topbar{align-items:flex-start}.logo{width:46px;height:46px;border-radius:15px}.mini-status{padding:8px 10px;font-size:10px}.hero{border-radius:26px}.trust-grid,.steps{grid-template-columns:1fr}.trust{display:flex;align-items:center;justify-content:space-between;gap:12px}.trust strong{margin:0}.section{grid-template-columns:1fr}.download{padding:17px 16px}.info{border-radius:21px}}
              @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
            </style>
          </head>
          <body>
            <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
            <main class="wrap">
              <header class="topbar">
                <a class="brand" href="../" aria-label="DraBornOdds web uygulaması"><span class="logo" aria-hidden="true">⚡</span><span>DraBorn<b>Odds</b></span></a>
                <div class="mini-status"><span class="dot"></span>RESMİ DAĞITIM</div>
              </header>
              <section class="hero">
                <div class="eyebrow"><span class="chip primary">🤖 Android · v${dkd_version} · code ${dkd_code}</span><span class="chip">🔐 İmzalı paket</span><span class="chip">✓ SHA-256 doğrulamalı</span></div>
                <h1>DraBornOdds'u <span class="gradient">Android'e indir.</span></h1>
                <p class="lead">Web ve Android aynı DraBornOdds uygulama kaynağından senkron üretilir. Bu APK DraBornEagle release anahtarıyla imzalanmış ve yayınlanmadan önce SHA-256 ile doğrulanmıştır.</p>
                <div class="trust-grid"><div class="trust"><strong><i>⚡</i>Hızlı kurulum</strong><span>Doğrudan APK</span></div><div class="trust"><strong><i>🛡️</i>İmzalı sürüm</strong><span>Release anahtarı</span></div><div class="trust"><strong><i>🔄</i>Web ile senkron</strong><span>Aynı uygulama kaynağı</span></div></div>
                <a class="download" href="${dkd_apk}" download><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>⚽ APK'YI İNDİR · v${dkd_version}</span></a>
                <p class="subnote">Android sürüm kodu ${dkd_code} · Resmî DraBornOdds dağıtım paketi</p>
              </section>
              <section class="section">
                <article class="info" style="--accent:var(--cyan)"><div class="info-head"><span class="info-title">SHA-256 parmak izi</span><button class="copy" type="button" data-copy="${dkd_sha}">Kopyala</button></div><div class="code">${dkd_sha}</div></article>
                <article class="info" style="--accent:var(--violet)"><div class="info-head"><span class="info-title">Kaynak commit</span><button class="copy" type="button" data-copy="${dkd_source}">Kopyala</button></div><div class="code">${dkd_source}</div></article>
              </section>
              <section class="install"><h2>Android'e nasıl kurulur?</h2><div class="steps"><div class="step"><b>01</b><strong>APK'yı indir</strong><br>Yukarıdaki yeşil indirme düğmesine dokun.</div><div class="step"><b>02</b><strong>Kuruluma izin ver</strong><br>Android isterse bu tarayıcı için uygulama yükleme iznini aç.</div><div class="step"><b>03</b><strong>DraBornOdds'u aç</strong><br>Kurulum bitince uygulamayı doğrudan başlat.</div></div><div class="warning"><span>⚠️</span><span>Güvenlik için yalnızca bu resmî DraBornOdds sayfasından indirdiğiniz paketi kurun. Dosyanın bütünlüğünü yukarıdaki SHA-256 değeriyle kontrol edebilirsiniz.</span></div></section>
              <nav class="footer" aria-label="DraBornOdds bağlantıları"><a href="../">⚽ Web uygulaması</a><a href="../privacy/">🛡️ Gizlilik</a><a href="SHA256.txt"># SHA-256</a><a href="CERTIFICATE.txt">🔏 İmza bilgisi</a></nav>
              <p class="copyright">DraBornEagle · DraBornOdds Android dağıtım merkezi</p>
            </main>
            <script>document.querySelectorAll('[data-copy]').forEach(function(dkd_btn){dkd_btn.addEventListener('click',function(){var dkd_value=dkd_btn.getAttribute('data-copy')||'';navigator.clipboard.writeText(dkd_value).then(function(){var dkd_old=dkd_btn.textContent;dkd_btn.textContent='Kopyalandı ✓';dkd_btn.classList.add('ok');setTimeout(function(){dkd_btn.textContent=dkd_old;dkd_btn.classList.remove('ok')},1600)}).catch(function(){dkd_btn.textContent='Seçip kopyala'})})});</script>
          </body>
          </html>
          DKD_HTML
      - name: Keep requested DraBornOdss APK URL alias
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DraBornOdss/App
          cat > DraBornOdss/App/index.html <<'DKD_HTML'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraBornOdds Android APK</title><meta http-equiv="refresh" content="0;url=/DraBornOdds/App/"><link rel="canonical" href="https://www.draborneagle.com/DraBornOdds/App/"><script>location.replace('/DraBornOdds/App/');</script></head><body><p>DraBornOdds Android APK sayfasına yönlendiriliyorsunuz. <a href="/DraBornOdds/App/">Devam et</a></p></body></html>
          DKD_HTML
      - name: Commit synchronized website and APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A DraBornOdds DraBornOdss/App
          if git diff --cached --quiet; then
            echo 'DraBornOdds web and APK are already synchronized.'
            exit 0
          fi
          git commit -m 'deploy(DraBornOdds): synchronize web and signed Android APK'
          for dkd_try in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
