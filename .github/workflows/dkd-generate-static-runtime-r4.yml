name: DraBornGate v3.2.7-r4 Static Runtime Generate

on:
  push:
    branches:
      - fix/dkd-v327-static-runtime-r4
    paths:
      - 'DraBornGate/assets/*.payload.txt'
      - '.github/workflows/dkd-generate-static-runtime-r4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draborngate-static-runtime-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip runtime-r4]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: fix/dkd-v327-static-runtime-r4
          fetch-depth: 0

      - name: Statik çalışma dosyalarını üret
        shell: bash
        run: |
          set -euo pipefail
          cd DraBornGate/assets

          dkd_unpack_single() {
            local dkd_input="$1"
            local dkd_output="$2"
            tr -d '\r\n' < "$dkd_input" | base64 --decode | gzip --decompress --stdout > "$dkd_output"
            test -s "$dkd_output"
          }

          dkd_unpack_joined() {
            local dkd_output="$1"
            shift
            cat "$@" | tr -d '\r\n' | base64 --decode | gzip --decompress --stdout > "$dkd_output"
            test -s "$dkd_output"
          }

          dkd_unpack_single app.v2.css.payload.txt app.v2.runtime.css
          dkd_unpack_joined app.v2.runtime.js \
            app.v2.payload.1.txt app.v2.payload.2.txt app.v2.payload.3.txt app.v2.payload.4.txt

          dkd_unpack_single v2.4.css.payload.txt v2.4.runtime.css
          dkd_unpack_single v2.4.js.payload.txt v2.4.runtime.js

          dkd_unpack_single v2.5.css.payload.txt v2.5.runtime.css
          dkd_unpack_joined v2.5.runtime.js \
            v2.5.js.payload.1.txt v2.5.js.payload.2.txt v2.5.js.payload.3.txt \
            v2.5.js.payload.4.txt v2.5.js.payload.5.txt

          dkd_unpack_single v2.6.css.payload.txt v2.6.runtime.css
          dkd_unpack_single v2.6.js.payload.txt v2.6.runtime.js

          dkd_unpack_single v3.2.4.css.payload.txt v3.2.4.runtime.css
          dkd_unpack_single v3.2.5.css.payload.txt v3.2.5.runtime.css
          dkd_unpack_single v3.2.4.js.payload.txt v3.2.4.runtime.js
          dkd_unpack_single v3.2.5.session.js.payload.txt v3.2.5.session.runtime.js
          dkd_unpack_single v3.2.5.features.js.payload.txt v3.2.5.features.runtime.js

          node --check app.v2.runtime.js
          node --check v2.4.runtime.js
          node --check v2.5.runtime.js
          node --check v2.6.runtime.js
          node --check v3.2.4.runtime.js
          node --check v3.2.5.session.runtime.js
          node --check v3.2.5.features.runtime.js

          wc -c *.runtime.js *.runtime.css

      - name: Üretilen dosyaları dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DraBornGate/assets/*.runtime.js DraBornGate/assets/*.runtime.css
          if git diff --cached --quiet; then
            echo 'Statik çalışma dosyaları zaten güncel.'
            exit 0
          fi
          git commit -m 'build: generate DraBornGate static runtime assets [skip runtime-r4]'
          git push origin HEAD:fix/dkd-v327-static-runtime-r4
