name: DraBornGate v3.2.6 Debug Decode

on:
  push:
    branches:
      - agent/draborngate-web-v3-2-6
    paths:
      - '.github/workflows/draborngate-v326-debug.yml'
      - 'DraBornGate/.debug-trigger-v326'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/draborngate-v326-debug.yml'
      - 'DraBornGate/.debug-trigger-v326'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/draborngate-web-v3-2-6
      - name: v3.2.5 katmanlarını aç
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DraBornGate/.debug-v326
          base64 -d DraBornGate/assets/v3.2.5.features.js.payload.txt | gzip -dc > DraBornGate/.debug-v326/v3.2.5.features.source.js
          base64 -d DraBornGate/assets/v3.2.5.session.js.payload.txt | gzip -dc > DraBornGate/.debug-v326/v3.2.5.session.source.js
          base64 -d DraBornGate/assets/v3.2.5.css.payload.txt | gzip -dc > DraBornGate/.debug-v326/v3.2.5.css
          base64 -d DraBornGate/assets/v3.2.4.js.payload.txt | gzip -dc > DraBornGate/.debug-v326/v3.2.4.ui.source.js
      - name: Geçici inceleme kaynaklarını yaz
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- DraBornGate/.debug-v326)" ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DraBornGate/.debug-v326
          git commit -m 'chore: decode v3.2.5 sources [v326-decoded]'
          git push origin HEAD:agent/draborngate-web-v3-2-6
