name: DraBornPS v0.3 music asset
on:
  push:
    paths:
      - ".github/workflows/dkdbornps-v03-music.yml"

permissions:
  contents: write

jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download staged DraBornPS music
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DraBornPS/assets/audio
          curl --fail --location --retry 3 --output DraBornPS/assets/audio/dkd-home-mix.webm 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3148c326-65e2-40b8-8925-645905dd3e68.webm?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjExZjFhNjY1ZWMyZWZjOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkxMDUwMn0.mIBgRugF-xhxfMnnmgi3LLJh5ZWP6Hps_aR0AZgHkYs'
          test "$(wc -c < DraBornPS/assets/audio/dkd-home-mix.webm)" -gt 5000000
      - name: Commit music asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DraBornPS/assets/audio/dkd-home-mix.webm
          if git diff --cached --quiet; then
            echo "Music asset already present."
            exit 0
          fi
          git commit -m "asset(DraBornPS): add v0.3 home music"
          git push origin HEAD:main
