name: DraBornPark Web Check

on:
  pull_request:
    paths:
      - 'DraBornPark/**'
      - '.github/workflows/drabornpark-web-check.yml'
  push:
    branches: [main]
    paths:
      - 'DraBornPark/**'
      - '.github/workflows/drabornpark-web-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Current JavaScript syntax
        run: |
          node --check DraBornPark/tag-app-v106.js
          node --check DraBornPark/tag-detail-v106.js
          node --check DraBornPark/tag-runtime-v1065.js

      - name: Required public pages
        run: |
          test -f DraBornPark/index.html
          test -f DraBornPark/tag/index.html
          test -f DraBornPark/t/index.html
          test -f DraBornPark/privacy/index.html
          test -f DraBornPark/terms/index.html
          test -f DraBornPark/data-safety/index.html
          test -f DraBornPark/account-deletion/index.html
          test -f DraBornPark/support/index.html

      - name: DraBornPark v1.0.9 route contract
        run: |
          grep -q "DraBornPark v1.0.9" DraBornPark/tag/index.html
          grep -q "BUILD='1090'" DraBornPark/tag/index.html
          grep -q "v1.0.9 • NFC + QR • AKTİF" DraBornPark/tag/index.html
          grep -q "DraBornPark v1.0.9" DraBornPark/t/index.html
          grep -q "tag-runtime-v1065.css?v=1090" DraBornPark/tag/index.html
          grep -q "tag-app-v106.js?v=1090" DraBornPark/tag/index.html

      - name: Secure message scrolling contract
        run: |
          grep -q 'id="dp-direct-history-list"' DraBornPark/tag-app-v106.js
          grep -q '#dp-direct-history-list' DraBornPark/tag-runtime-v1065.css
          grep -q 'overflow-y:auto' DraBornPark/tag-runtime-v1065.css
          grep -q 'max-height:340px' DraBornPark/tag-runtime-v1065.css
          grep -q 'min-height:230px' DraBornPark/tag-runtime-v1065.css
          grep -q 'GÜVENLİ MESAJLAŞMA' DraBornPark/tag-runtime-v1065.js

      - name: Direct messaging and privacy essentials
        run: |
          grep -q "category:'direct_message'" DraBornPark/tag-app-v106.js
          grep -q "CANLI FOTOĞRAF ÇEK" DraBornPark/tag-app-v106.js
          grep -q "Gizlilik Politikası" DraBornPark/tag-app-v106.js
          grep -q "play.google.com/store/apps/details?id=com.draborneagle.drabornpark" DraBornPark/tag-app-v106.js
          grep -q "DrabornEagle" DraBornPark/privacy/index.html
          grep -q "DraBornPark/account-deletion/" DraBornPark/privacy/index.html

      - name: Legacy visible route versions are gone
        run: |
          ! grep -Eq 'DraBornPark v1\.0\.[0-8]' DraBornPark/tag/index.html
          ! grep -Eq 'DraBornPark v1\.0\.[0-8]' DraBornPark/t/index.html
