name: DraBornPark Web Check

on:
  pull_request:
    paths:
      - 'DraBornPark/**'
      - '.github/workflows/drabornpark-web-check.yml'
  push:
    branches: [main]
    paths:
      - 'DraBornPark/**'
      - '.github/workflows/drabornpark-web-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check DraBornPark/app.js
          node --check DraBornPark/test1-v046.js
          node --check DraBornPark/test1-v050-icons.js
      - name: Required public pages
        run: |
          test -f DraBornPark/index.html
          test -f DraBornPark/privacy/index.html
          test -f DraBornPark/terms/index.html
          test -f DraBornPark/data-safety/index.html
          test -f DraBornPark/account-deletion/index.html
          test -f DraBornPark/support/index.html
      - name: Test1 isolated safe demo contract
        run: |
          grep -q "clean!=='TEST1'" DraBornPark/test1-v046.js
          grep -q "üretim verisine yazılmaz" DraBornPark/test1-v046.js
          grep -q "dbp47-choice" DraBornPark/test1-v046.js
          grep -q "aria-pressed" DraBornPark/test1-v046.js
          grep -q "prefers-reduced-motion" DraBornPark/test1-v046.css
      - name: Shared Remix Icon contact UI
        run: |
          grep -q "remixicon@4.9.1" DraBornPark/test1-v050-icons.js
          grep -q "ri-car-line" DraBornPark/test1-v050-icons.js
          grep -q "ri-door-open-line" DraBornPark/test1-v050-icons.js
          grep -q "ri-phone-lock-line" DraBornPark/test1-v050-icons.js
          grep -q "enhanceLiveContact" DraBornPark/test1-v050-icons.js
          grep -q "dbp52-live" DraBornPark/test1-v050-icons.js
          grep -q "DOKUN • SEÇ" DraBornPark/test1-v050-icons.js
          grep -q "font-size:12.5px" DraBornPark/test1-v050-icons.js
          ! grep -q "<svg" DraBornPark/test1-v050-icons.js
      - name: Google Play privacy essentials
        run: |
          grep -q "DrabornEagle" DraBornPark/privacy/index.html
          grep -q "DraBornPark/support/" DraBornPark/privacy/index.html
          grep -q "DraBornPark/account-deletion/" DraBornPark/privacy/index.html
          grep -q "Hesabı yalnızca devre dışı bırakmak" DraBornPark/privacy/index.html
          grep -q "HTTPS/TLS" DraBornPark/privacy/index.html
          grep -q "saklama" DraBornPark/privacy/index.html
          grep -q "uygulama içinden" DraBornPark/account-deletion/index.html
          grep -q "giriş gerekmez" DraBornPark/account-deletion/index.html
          grep -q "Data Safety" DraBornPark/data-safety/index.html
