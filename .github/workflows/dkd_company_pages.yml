# DraBornEagle public website deployment
name: DKD DrabornEagle public web

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dkd-company-pages
  cancel-in-progress: true

jobs:
  dkd_build_pages:
    runs-on: ubuntu-latest
    steps:
      - name: DKD Checkout repository
        uses: actions/checkout@v4

      - name: DKD Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: DKD Synchronize DraBornPS homepage
        run: node scripts/dkd-sync-drabornps-root.mjs

      - name: DKD Verify DraBornPS homepage
        run: node scripts/dkd-sync-drabornps-root.mjs --check

      - name: DKD Build DraBornZikir web from universal Expo source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/DraBornZikir-source "$GITHUB_WORKSPACE/DraBornZikir"
          git clone --depth 1 https://github.com/DrabornEagle/DraBornZikir.git /tmp/DraBornZikir-source
          cd /tmp/DraBornZikir-source
          npm ci
          npx expo install react-dom react-native-web @expo/metro-runtime --npm
          npm run typecheck
          npm run lint
          npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/DraBornZikir" --clear
          test -s "$GITHUB_WORKSPACE/DraBornZikir/index.html"
          printf 'Universal source commit: %s\n' "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/DraBornZikir/DKD-SOURCE.txt"

      - name: DKD Add immersive loader and mobile browser integration
        run: python scripts/dkd-patch-drabornzikir-web.py

      - name: DKD Verify DraBornZikir static routes
        shell: bash
        run: |
          set -euo pipefail
          test -s DraBornZikir/index.html
          test -s DraBornZikir/manifest.webmanifest
          test -s DraBornZikir/library/index.html
          test -s DraBornZikir/radio/index.html
          test -s DraBornZikir/progress/index.html
          grep -F 'name="theme-color" content="#071827"' DraBornZikir/index.html >/dev/null
          grep -F 'id="dkd-web-loader"' DraBornZikir/index.html >/dev/null
          grep -F 'black-translucent' DraBornZikir/index.html >/dev/null
          grep -F '/DraBornZikir/' DraBornZikir/library/index.html >/dev/null
          echo 'DraBornZikir static routes, loader and dark mobile browser chrome verified.'

      - name: DKD Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: DKD Upload company pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  dkd_deploy_pages:
    needs: dkd_build_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dkd_deployment.outputs.page_url }}
    steps:
      - name: DKD Deploy GitHub Pages
        id: dkd_deployment
        uses: actions/deploy-pages@v4
