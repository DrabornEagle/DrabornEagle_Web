# DraBornEagle public website deployment - universal Expo apps
name: DKD DrabornEagle public web

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dkd-company-pages
  cancel-in-progress: true

jobs:
  dkd_build_pages:
    runs-on: ubuntu-latest
    steps:
      - name: DKD Checkout repository
        uses: actions/checkout@v4

      - name: DKD Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: DKD Synchronize DraBornPS homepage
        run: node scripts/dkd-sync-drabornps-root.mjs

      - name: DKD Verify DraBornPS homepage
        run: node scripts/dkd-sync-drabornps-root.mjs --check

      - name: DKD Build DraBornZikir web from universal Expo source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/DraBornZikir-source "$GITHUB_WORKSPACE/DraBornZikir"
          git clone --depth 1 https://github.com/DrabornEagle/DraBornZikir.git /tmp/DraBornZikir-source
          cd /tmp/DraBornZikir-source
          npm ci
          npx expo install react-dom react-native-web @expo/metro-runtime --npm
          npm run typecheck
          npm run lint
          npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/DraBornZikir" --clear
          test -s "$GITHUB_WORKSPACE/DraBornZikir/index.html"
          printf 'Universal source commit: %s\n' "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/DraBornZikir/DKD-SOURCE.txt"

      - name: DKD Add immersive loader and mobile browser integration
        run: python scripts/dkd-patch-drabornzikir-web.py

      - name: DKD Verify DraBornZikir static routes
        shell: bash
        run: |
          set -euo pipefail
          test -s DraBornZikir/index.html
          test -s DraBornZikir/manifest.webmanifest
          test -s DraBornZikir/library/index.html
          test -s DraBornZikir/radio/index.html
          test -s DraBornZikir/progress/index.html
          grep -F 'name="theme-color" content="#071827"' DraBornZikir/index.html >/dev/null
          grep -F 'id="dkd-web-loader"' DraBornZikir/index.html >/dev/null
          grep -F 'black-translucent' DraBornZikir/index.html >/dev/null
          grep -F '/DraBornZikir/' DraBornZikir/library/index.html >/dev/null
          echo 'DraBornZikir static routes, loader and dark mobile browser chrome verified.'

      - name: DKD Build DraBornBuy web from Android source
        shell: bash
        env:
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ vars.DBB_MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/DraBornBuy-source "$GITHUB_WORKSPACE/DraBornBuy"
          git clone --depth 1 https://github.com/DrabornEagle/DraBornBuy.git /tmp/DraBornBuy-source
          cd /tmp/DraBornBuy-source
          npm ci --legacy-peer-deps
          npm run check
          test -s .env.production
          npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/DraBornBuy" --clear
          test -s "$GITHUB_WORKSPACE/DraBornBuy/index.html"
          grep -F '/DraBornBuy/_expo/' "$GITHUB_WORKSPACE/DraBornBuy/index.html" >/dev/null
          cp README.md "$GITHUB_WORKSPACE/DraBornBuy/README.md"
          printf 'Universal source commit: %s\n' "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/DraBornBuy/DKD-SOURCE.txt"

      - name: DKD Commit synchronized DraBornBuy web files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A DraBornBuy
          if ! git diff --cached --quiet; then
            git commit -m 'build(DraBornBuy): sync Expo web from Android source'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi

      - name: DKD Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: DKD Upload company pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  dkd_deploy_pages:
    needs: dkd_build_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dkd_deployment.outputs.page_url }}
    steps:
      - name: DKD Deploy GitHub Pages
        id: dkd_deployment
        uses: actions/deploy-pages@v4
