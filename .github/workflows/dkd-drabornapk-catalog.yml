name: DKD DraBornAPK - Refresh F-Droid catalog

on:
  push:
    branches: [main]
    paths:
      - "DraBornAPK/scripts/dkd-update-catalog.mjs"
      - "DraBornAPK/scripts/dkd-update-catalog.test.mjs"
      - ".github/workflows/dkd-drabornapk-catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "18 4 * * *"

permissions:
  contents: write

concurrency:
  group: dkd-drabornapk-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate catalog logic
        run: node --test DraBornAPK/scripts/dkd-update-catalog.test.mjs
      - name: Refresh catalog
        run: node DraBornAPK/scripts/dkd-update-catalog.mjs
      - name: Publish updated catalog
        run: |
          if git diff --quiet -- DraBornAPK/assets/dkd-catalog.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "draborneagle-automation"
          git config user.email "actions@users.noreply.github.com"
          git add DraBornAPK/assets/dkd-catalog.json
          git commit -m "data(DraBornAPK): refresh independent F-Droid APK catalog"
          git push origin HEAD:main
