name: DraBornPark Unified Tag v1.0.5 Check

on:
  push:
    branches: [main]
    paths:
      - 'DraBornPark/unified-tag-v105.js'
      - 'DraBornPark/unified-tag-v105.css'
      - 'DraBornPark/index.html'
      - 'DraBornPark/tag/index.html'
      - '.github/workflows/drabornpark-unified-v105-check.yml'
  pull_request:
    paths:
      - 'DraBornPark/unified-tag-v105.js'
      - 'DraBornPark/unified-tag-v105.css'
      - 'DraBornPark/index.html'
      - 'DraBornPark/tag/index.html'
      - '.github/workflows/drabornpark-unified-v105-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check DraBornPark/unified-tag-v105.js
      - name: Unified tag contract
        run: |
          grep -q "KORUMALI ARAÇ" DraBornPark/unified-tag-v105.js
          grep -q "snapshot?.username" DraBornPark/unified-tag-v105.js
          grep -q "ARAÇ SAHİBİNE GÖNDER" DraBornPark/unified-tag-v105.js
          grep -q "getUserMedia" DraBornPark/unified-tag-v105.js
          grep -q "facingMode" DraBornPark/unified-tag-v105.js
          grep -q "ANLIK KANIT" DraBornPark/unified-tag-v105.js
          grep -q "canvas.toDataURL('image/jpeg'" DraBornPark/unified-tag-v105.js
          grep -q "Galeriden seçim yok" DraBornPark/unified-tag-v105.js
          grep -q "unified-tag-v105.css?v=1051" DraBornPark/tag/index.html
          grep -q "unified-tag-v105.js?v=1051" DraBornPark/tag/index.html
          grep -q "unified-tag-v105.css?v=1051" DraBornPark/index.html
          grep -q "unified-tag-v105.js?v=1051" DraBornPark/index.html
      - name: No gallery picker in unified camera layer
        run: |
          ! grep -q 'type="file"' DraBornPark/unified-tag-v105.js
          ! grep -q 'accept="image' DraBornPark/unified-tag-v105.js
