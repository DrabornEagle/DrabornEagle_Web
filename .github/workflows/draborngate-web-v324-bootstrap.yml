name: Apply DraBornGate Web v3.2.4

on:
  push:
    branches:
      - feature/draborngate-web-v3-2-4
    paths:
      - 'scripts/dkd_apply_v324.mjs'
      - 'scripts/v324_payload/**'
      - '.github/workflows/draborngate-web-v324-bootstrap.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/dkd_apply_v324.mjs'
      - 'scripts/v324_payload/**'
      - '.github/workflows/draborngate-web-v324-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draborngate-web-v324-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: feature/draborngate-web-v3-2-4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.2.4 dosyalarını uygula
        run: node scripts/dkd_apply_v324.mjs
      - name: v3.2.4 doğrulamalarını çalıştır
        run: |
          node --check DraBornGate/assets/app.js
          node --check DraBornGate/assets/v3.2.4.guard.js
          node --check DraBornGate/assets/v3.2.4.data.js
          node --check DraBornGate/assets/v3.2.4.js
          node --check DraBornGate/assets/v3.2.4.patch.js
          node --check DraBornGate/sw.js
          node DraBornGate/tests/dkd_verify_web_v324.mjs
      - name: v3.2.4 sürümünü kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: DraBornGate Web v3.2.4 admin ve kurye deneyimi" || exit 0
          git push origin HEAD:feature/draborngate-web-v3-2-4
