name: DraBornGate v3.2.5 Build

on:
  push:
    branches:
      - agent/draborngate-web-v3-2-5
    paths:
      - 'DraBornGate/scripts/dkd_build_v325.mjs'
      - 'DraBornGate/assets/v3.2.5*'
      - 'DraBornGate/assets/app.js'
      - 'DraBornGate/assets/v2.8.js'
      - 'DraBornGate/index.html'
      - 'DraBornGate/Guvenlik-Sade-Tema/index.html'
      - 'DraBornGate/manifest.webmanifest'
      - 'DraBornGate/sw.js'
      - '.github/workflows/draborngate-v325-build.yml'

permissions:
  contents: write

concurrency:
  group: draborngate-v325-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v325-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/draborngate-web-v3-2-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: v3.2.5 yayın dosyalarını üret
        run: node DraBornGate/scripts/dkd_build_v325.mjs
      - name: Üretilen dosyaları dala yaz
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DraBornGate/assets/app.js DraBornGate/assets/v2.8.js DraBornGate/assets/v3.2.1.data.js DraBornGate/index.html DraBornGate/Guvenlik-Sade-Tema/index.html DraBornGate/manifest.webmanifest DraBornGate/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: generate DraBornGate Web v3.2.5 [v325-generated]'
          git push origin HEAD:agent/draborngate-web-v3-2-5
