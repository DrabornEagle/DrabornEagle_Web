<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030713">
  <meta http-equiv="refresh" content="2;url=/DraBornGate/?theme=modern&dkd_emergency=293">
  <title>DraBornGate | Kararlı Güvenlik Paneline Geçiliyor</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 28%,#10264a 0,#060b18 46%,#02050d 100%);color:#f7fbff;font-family:Inter,system-ui,sans-serif;text-align:center}.card{width:min(100%,520px);padding:38px 28px;border-radius:30px;border:1px solid rgba(91,218,255,.3);background:rgba(6,17,38,.88)}.mark{width:104px;height:104px;margin:0 auto 24px;border-radius:31px;display:grid;place-items:center;border:1px solid rgba(71,220,255,.6);background:linear-gradient(145deg,rgba(48,203,244,.22),rgba(130,83,255,.25);font-size:31px;font-weight:950;color:#65e4ff}.card h1{margin:0;font-size:clamp(27px,7vw,38px)}.card p{margin:15px 0 24px;color:#aebbd0;font-size:17px;line-height:1.6}.card a{display:block;padding:16px 20px;border-radius:18px;color:#07101c;text-decoration:none;font-size:17px;font-weight:900;background:linear-gradient(100deg,#45ddff,#8878ff)}
  </style>
  <script>
    const dkdStableUrl = '/DraBornGate/?theme=modern&dkd_emergency=293';
    try {
      sessionStorage.removeItem('dkd_gate_security_theme');
      sessionStorage.removeItem('dkd_gate_force_theme');
      sessionStorage.removeItem('dkd_gate_route');
      sessionStorage.removeItem('dkd_gate_clean_personal_route');
      sessionStorage.setItem('dkd_gate_security_theme', 'modern');
    } catch {}
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((dkdRegistrations) => {
        dkdRegistrations
          .filter((dkdRegistration) => String(dkdRegistration.scope || '').includes('/DraBornGate/'))
          .forEach((dkdRegistration) => dkdRegistration.unregister());
      }).catch(() => undefined);
    }
    if ('caches' in window) {
      caches.keys().then((dkdKeys) => Promise.allSettled(
        dkdKeys.filter((dkdKey) => dkdKey.startsWith('draborngate-web-')).map((dkdKey) => caches.delete(dkdKey))
      )).catch(() => undefined);
    }
    setTimeout(() => location.replace(dkdStableUrl), 180);
  </script>
</head>
<body>
  <main class="card">
    <div class="mark">DBG</div>
    <h1>Kararlı Güvenlik Paneline Geçiliyor</h1>
    <p>Dokunmayı engelleyen Sade Tema katmanı geçici olarak devreden çıkarıldı.</p>
    <a href="/DraBornGate/?theme=modern&dkd_emergency=293">Güvenlik Panelini Aç</a>
  </main>
</body>
</html>
