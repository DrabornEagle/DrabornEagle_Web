    #dkd-v26-splash{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;align-content:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#102447 0,#060b18 42%,#02050d 100%);color:#f7fbff;font-family:Inter,system-ui,sans-serif;transition:opacity .38s ease,visibility .38s ease}#dkd-v26-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}#dkd-v26-splash .mark{width:116px;height:116px;border-radius:36px;display:grid;place-items:center;border:1px solid rgba(71,220,255,.58);background:linear-gradient(145deg,rgba(48,203,244,.24),rgba(130,83,255,.22));font-size:38px;font-weight:950;color:#64e1ff;box-shadow:0 0 0 12px rgba(73,214,255,.035),0 24px 70px rgba(0,0,0,.34)}#dkd-v26-splash strong{font-size:clamp(30px,6vw,46px)}#dkd-v26-splash span{font-size:17px;color:#aebbd0}#dkd-v26-splash .bar{width:min(76vw,480px);height:7px;border-radius:999px;overflow:hidden;background:#111a2d}#dkd-v26-splash .bar i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#40dbff,#8c72ff);animation:dkdSplash 1.3s ease-in-out infinite alternate}@keyframes dkdSplash{to{width:82%}}@media(prefers-reduced-motion:reduce){#dkd-v26-splash .bar i{animation:none;width:72%}}
