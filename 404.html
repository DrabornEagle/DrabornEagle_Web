<!doctype html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050816"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>DraBornEagle | Sayfa Bulunamadı</title></head>
<body>
<script>
(() => { addEventListener('pageshow', event => { if (event.persisted) location.reload(); }); })();
(async () => {
  const path = location.pathname + location.search + location.hash;
  // Retired /Apps/ pages must remain genuine 404s. Never silently forward
  // crawlers or visitors to the homepage from removed legacy app URLs.
  if (/^\/Apps(?:\/|$)/i.test(location.pathname)) {
    document.title = 'DraBornEagle | Sayfa Kaldırıldı';
    const main = document.createElement('main');
    main.setAttribute('role', 'main');
    main.style.cssText = 'box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;background:#080916;color:#f8f7ff;font:16px/1.65 system-ui,-apple-system,sans-serif;text-align:center';
    main.innerHTML = '<h1 style="font-size:clamp(28px,6vw,48px);margin:0">Bu sayfa artık mevcut değil.</h1><p style="max-width:550px;margin:0;color:#c9c4da">Aradığın eski bağlantı kaldırıldı. Güncel oyunları, uygulamaları ve projeleri DraBornEagle ana sayfasından keşfedebilirsin.</p><a href="/" style="color:#79e9ff;font-weight:700;text-underline-offset:4px">DraBornEagle ana sayfasına git →</a>';
    document.body.replaceChildren(main);
    return;
  }
  const tagMatch = location.pathname.match(/^\/DraBornPark\/tag\/([^/]+)\/?$/i);
  if (tagMatch) {
    try {
      const response = await fetch('/DraBornPark/tag/index.html?v=1070&ts=' + Date.now(), {cache:'no-store',headers:{'Cache-Control':'no-cache'}});
      if (!response.ok) throw new Error('tag_shell_unavailable');
      const html = await response.text();
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (_) {
      document.body.textContent = 'DraBornPark v1.0.7 etiket sayfası şu anda açılamadı.';
      return;
    }
  }

  const legacyMatch = location.pathname.match(/^\/DraBornPark\/t\/([^/]+)\/?$/i);
  if (legacyMatch) {
    try {
      const token = decodeURIComponent(legacyMatch[1]);
      const response = await fetch('https://xpdiwyxnnrmyvpcqwuyb.supabase.co/functions/v1/drabornpark-public-contact', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'lookup',tagCode:token}),
        cache:'no-store'
      });
      const data = await response.json();
      const code = String(data?.snapshot?.nfcConnectionCode || data?.snapshot?.shortCode || '').trim();
      if (!response.ok || !/^\d{4}-\d{4}$/.test(code)) throw new Error('legacy_tag_unresolved');
      location.replace('/DraBornPark/tag/' + encodeURIComponent(code) + '?v=1070');
      return;
    } catch (_) {
      location.replace('/DraBornPark/tag/?v=1070');
      return;
    }
  }

  if (location.pathname.startsWith('/DraBornSeries/')) {
    try {
      const response = await fetch('/DraBornSeries/index.html?v=074&ts=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw new Error('series_shell_unavailable');
      const html = await response.text();
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (_) {
      document.body.textContent = 'DraBornSeries şu anda açılamadı. Lütfen bağlantını kontrol edip tekrar dene.';
      return;
    }
  }
  if (location.pathname.startsWith('/DraBornGate/')) {
    sessionStorage.setItem('dkd_gate_route', path);
    location.replace('/DraBornGate/');
    return;
  }
  if (location.pathname.startsWith('/DraBornGarage/')) {
    sessionStorage.setItem('dkd_garage_route', path);
    location.replace('/DraBornGarage/');
    return;
  }
  location.replace('/');
})();
</script>
</body>
</html>
