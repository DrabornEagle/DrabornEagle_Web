<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a10"><title>DraBorn: SHIFT//ERROR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#f7f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#080a10}#boot>div{text-align:center;padding:24px}#boot b{display:block;font-size:26px;letter-spacing:.04em}#boot small{display:block;margin-top:10px;color:#99a4ba;letter-spacing:.14em;font-size:11px}#bar{width:180px;height:4px;margin:18px auto 0;background:#1b2030;border-radius:999px;overflow:hidden}#bar i{display:block;width:35%;height:100%;background:#68f0c5;animation:p 1s ease-in-out infinite alternate}@keyframes p{to{transform:translateX(185%)}}</style></head><body><div id="boot"><div><b>DraBorn SHIFT//ERROR</b><small>LIVE CIRCUIT // LOADING</small><div id="bar"><i></i></div></div></div><script>(async()=>{try{const base=(location.pathname.endsWith('/')?location.pathname:location.pathname+'/')+'payload/';const get=async n=>{const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return r.text()};const[p1,p2,p3,r1,r2a,r2b,r3]=await Promise.all([get('part01.txt'),get('part02.txt'),get('part03.txt'),get('rest01.b64'),get('rest02a.b64'),get('rest02b.b64'),get('rest03.b64')]);if(typeof DecompressionStream==='undefined')throw new Error('Browser gzip decompression is not supported');const b64=(r1+r2a+r2b+r3).replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const rest=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const html=p1+p2+p3+rest;document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>BOOT ERROR</b><small>'+String(e)+'</small></div>'}})();</script></body></html>
