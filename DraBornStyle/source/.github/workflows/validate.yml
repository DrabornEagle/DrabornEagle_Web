name: DraBornStyle validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: style-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
        env:
          EXPO_OFFLINE: '1'
      - run: npm run export:android
      - run: npm run build:web
        env:
          STYLE_SOURCE_COMMIT: ${{ github.sha }}
